<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compêndio Pediátrico</title>
<meta name="description" content="Compêndio Pediátrico — 330 temas organizados em formato de consulta rápida.">
<style>
:root{--bg:#f4f7f6;--paper:#fff;--ink:#1c2b28;--muted:#6f7f7a;--line:#dfe7e4;--accent:#0f766e;--accent2:#134e4a;--soft:#edf6f4;--warn:#fff8e8;--shadow:0 14px 34px rgba(20,62,55,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f8fbfa 0,#f3f6f5 240px);color:var(--ink)}
header{padding:34px 20px 22px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
.header-inner{width:min(1180px,94vw);margin:auto}h1{margin:0;font-size:clamp(28px,4vw,42px);letter-spacing:-1.4px;line-height:1.05;font-weight:800;color:#163c38}
main{width:min(1180px,94vw);margin:22px auto 48px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:18px}.search{width:100%;padding:14px 16px;border:1px solid #cfdad6;border-radius:12px;background:#fff;font-size:15px;outline:none;box-shadow:0 4px 14px rgba(20,62,55,.04)}.search:focus{border-color:#78b8af;box-shadow:0 0 0 4px rgba(15,118,110,.09)}.count{font-size:12px;color:var(--muted);white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.6fr);gap:18px;align-items:start}.list{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-height:calc(100vh - 150px);position:sticky;top:116px}.list-scroll{overflow:auto;max-height:calc(100vh - 150px);padding:8px}.topic-btn{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:11px 12px;color:#334641;font-size:13px;line-height:1.35;cursor:pointer}.topic-btn:hover{background:#f4f8f7}.topic-btn.active{background:var(--soft);color:var(--accent2);font-weight:700}.topic-btn small{color:#94a19d;margin-right:5px}
.detail{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:520px;padding:26px}.empty{color:#8a9894;padding:40px 8px}.topic-title{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:0 0 18px;color:#153f3a;letter-spacing:-.8px}.topic-number{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 9px;border-radius:10px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:800;margin-right:9px;vertical-align:3px}.section{border-top:1px solid var(--line);padding:17px 0}.section:first-of-type{border-top:0;padding-top:2px}.section h2{margin:0 0 9px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800}.section p{margin:0 0 9px;line-height:1.72;color:#334641}.section p:last-child{margin-bottom:0}.section ul{margin:7px 0 0;padding-left:20px}.section li{margin:6px 0;line-height:1.55}.callout{background:var(--soft);border:1px solid #d3e8e3;border-radius:12px;padding:13px 14px;margin:9px 0;line-height:1.6}.callout strong{color:var(--accent2)}.warn{background:var(--warn);border-color:#f1ddb0}.refs{font-size:12px;color:#72817d}.meta{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);color:#81908c;font-size:11px;line-height:1.55}
mark{background:#fff1a8;padding:0 .15em;border-radius:2px}
@media(max-width:840px){header{position:static}.layout{grid-template-columns:1fr}.list{position:static;max-height:340px}.list-scroll{max-height:340px}.detail{min-height:0}.toolbar{grid-template-columns:1fr}.count{padding-left:2px}}
</style>
</head>
<body>
<header><div class="header-inner"><h1>Compêndio Pediátrico</h1></div></header>
<main>
  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="Buscar diagnóstico, tema, medicamento ou termo clínico…" autocomplete="off">
    <div id="count" class="count">Carregando…</div>
  </div>
  <div class="layout">
    <aside class="list"><div id="list" class="list-scroll"></div></aside>
    <article id="detail" class="detail"><div class="empty">Selecione um diagnóstico para abrir o conteúdo.</div></article>
  </div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function parseTopics(md){
  const re=/^##\s+(\d+)\.\s+(.+)$/gm, found=[]; let m;
  while((m=re.exec(md))) found.push({n:Number(m[1]),title:m[2].trim(),start:re.lastIndex,head:m.index});
  return found.map((x,i)=>({...x,body:md.slice(x.start,i+1<found.length?found[i+1].head:md.length).trim()}));
}
function bodyHtml(body){
  const lines=body.split(/\r?\n/), out=[]; let buf=[], list=[];
  const flush=()=>{if(buf.length){out.push('<div class="section">'+buf.join('')+'</div>');buf=[]} if(list.length){out.push('<div class="section"><ul>'+list.join('')+'</ul></div>');list=[]}};
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    if(/^###\s+/.test(line)){flush(); out.push('<div class="section"><h2>'+inline(line.replace(/^###\s+/,''))+'</h2></div>'); continue}
    const bullet=line.match(/^[-*]\s+(.+)/); if(bullet){list.push('<li>'+inline(bullet[1])+'</li>'); continue}
    const lead=line.match(/^\*\*(.+?):\s*\*\*\s*(.*)$/);
    if(lead){flush(); const cls=/alerta|contra|grave|urg|risco|máximo|maximo/i.test(lead[1])?'callout warn':'callout'; out.push('<div class="'+cls+'"><strong>'+esc(lead[1])+':</strong> '+inline(lead[2])+'</div>'); continue}
    buf.push('<p>'+inline(line)+'</p>');
  }
  flush(); return out.join('');
}
let topics=[], filtered=[];
function renderList(){
  const list=document.getElementById('list'); list.innerHTML='';
  filtered.forEach(t=>{const b=document.createElement('button'); b.className='topic-btn'; b.dataset.n=t.n; b.innerHTML='<small>'+t.n+'.</small> '+esc(t.title); b.onclick=()=>showTopic(t.n); list.appendChild(b)});
  document.getElementById('count').textContent=filtered.length+' de '+topics.length+' temas';
}
function showTopic(n){
  const t=topics.find(x=>x.n===n); if(!t)return;
  document.querySelectorAll('.topic-btn').forEach(b=>b.classList.toggle('active',Number(b.dataset.n)===n));
  document.getElementById('detail').innerHTML='<h2 class="topic-title"><span class="topic-number">'+t.n+'</span>'+esc(t.title)+'</h2>'+bodyHtml(t.body)+'<div class="meta">Fonte-base: PedWB — Compêndio pediátrico consolidado. Conteúdo documental organizado para consulta profissional; revisar indicação, população, apresentação e fonte primária aplicável antes de uso clínico.</div>';
  history.replaceState(null,'','#tema-'+n);
  if(innerWidth<841) document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'});
}
fetch('./PedWB_Consolidado.md',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(md=>{
  topics=parseTopics(md); filtered=[...topics]; renderList();
  const n=Number(location.hash.replace('#tema-','')); if(n&&topics.some(t=>t.n===n))showTopic(n); else if(topics.length)showTopic(topics[0].n);
}).catch(e=>{document.getElementById('detail').innerHTML='<div class="empty">Falha ao carregar o compêndio: '+esc(e.message)+'</div>';document.getElementById('count').textContent='Falha de carregamento'});
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(); filtered=!q?[...topics]:topics.filter(t=>(t.title+' '+t.body).toLowerCase().includes(q));renderList()});
</script>
</body></html>
