<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compêndio Pediátrico</title>
<meta name="description" content="Compêndio Pediátrico — diagnósticos pediátricos organizados para consulta rápida.">
<link rel="canonical" href="https://iagochaves3-cell.github.io/compeniowb">
<script>
const officialUrl='https://iagochaves3-cell.github.io/compeniowb';
if(location.pathname!=='/compeniowb'&&location.pathname!=='/compeniowb/'){
  location.replace(officialUrl+location.hash);
}
</script>
<style>
:root{--bg:#080d12;--panel:#101820;--panel-2:#151f29;--ink:#f3f7fa;--muted:#9aa9b5;--line:#263440;--accent:#69e0c2;--accent-2:#a4f3df;--soft:#12332f;--warn:#3b2d16;--shadow:0 20px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% -10%,#183b3b 0,transparent 34rem),linear-gradient(180deg,#0b1117 0,#080d12 420px);color:var(--ink)}
header{padding:32px 20px 25px;border-bottom:1px solid var(--line);background:rgba(8,13,18,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}.header-inner{width:min(1180px,94vw);margin:auto}h1{margin:0;font-size:clamp(28px,4vw,42px);letter-spacing:-1.4px;line-height:1.05;font-weight:800;color:var(--ink)}.header-subtitle{margin:10px 0 0;color:var(--muted);font-size:13px;letter-spacing:.02em}
main{width:min(1180px,94vw);margin:24px auto 52px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:18px}.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:15px;outline:none;box-shadow:var(--shadow)}.search::placeholder{color:#71818e}.search:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(105,224,194,.12)}.count{font-size:12px;color:var(--muted);white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.6fr);gap:18px;align-items:start}.list{background:rgba(16,24,32,.92);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-height:calc(100vh - 150px);position:sticky;top:116px}.list-scroll{overflow:auto;max-height:calc(100vh - 150px);padding:8px}.topic-btn{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:11px 12px;color:#c7d3da;font-size:13px;line-height:1.35;cursor:pointer}.topic-btn:hover{background:#1b2933;color:var(--ink)}.topic-btn.active{background:var(--soft);color:var(--accent-2);font-weight:700}.topic-btn small{color:#71818e;margin-right:5px}
.detail{background:linear-gradient(145deg,rgba(21,31,41,.98),rgba(14,22,29,.98));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:520px;padding:28px}.empty{color:var(--muted);padding:40px 8px}.topic-title{font-size:clamp(24px,3vw,36px);line-height:1.15;margin:0 0 22px;color:var(--ink);letter-spacing:-.8px}.topic-number{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 9px;border-radius:10px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:800;margin-right:9px;vertical-align:4px}.section{border:1px solid var(--line);border-radius:12px;background:rgba(16,24,32,.72);padding:17px 18px;margin:12px 0}.section:first-of-type{margin-top:0}.section h2{margin:0 0 11px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800}.section p{margin:0 0 10px;line-height:1.78;color:#d3dde3}.section p:last-child{margin-bottom:0}.section ul{margin:4px 0 0;padding-left:21px}.section li{margin:7px 0;line-height:1.65;color:#d3dde3}.section li::marker{color:var(--accent)}.callout{background:var(--soft);border:1px solid #245a50;border-radius:10px;padding:14px 15px;margin:10px 0;line-height:1.65;color:#d9f8ef}.callout strong{color:var(--accent)}.warn{background:var(--warn);border-color:#735628;color:#ffedc2}.warn strong{color:#ffd67d}.meta{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);color:#82929e;font-size:11px;line-height:1.6}mark{background:#806b24;color:#fff1b0;padding:0 .15em;border-radius:2px}a{color:var(--accent)}
@media(max-width:840px){header{position:static}.layout{grid-template-columns:1fr}.list{position:static;max-height:340px}.list-scroll{max-height:340px}.detail{min-height:0}.toolbar{grid-template-columns:1fr}.count{padding-left:2px}}@media(max-width:520px){main{width:min(100% - 28px,1180px)}.detail{padding:20px 15px}.section{padding:15px 14px}}
</style>
</head>
<body>
<noscript><p><a href="https://iagochaves3-cell.github.io/compeniowb">Acessar o Compêndio Pediátrico oficial</a></p></noscript>
<header><div class="header-inner"><h1>Compêndio Pediátrico</h1><p class="header-subtitle">Consulta clínica organizada • conteúdo profissional para revisão rápida</p></div></header>
<main>
  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="Buscar diagnóstico, tema, medicamento ou termo clínico…" autocomplete="off">
    <div id="count" class="count">Carregando…</div>
  </div>
  <div class="layout">
    <aside class="list"><div id="list" class="list-scroll"></div></aside>
    <article id="detail" class="detail"><div class="empty">Selecione um diagnóstico para abrir o conteúdo.</div></article>
  </div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function parseTopics(md){
  const re=/^##\s+(\d+)\.\s+(.+)$/gm, found=[]; let m;
  while((m=re.exec(md))) found.push({n:Number(m[1]),title:m[2].trim(),start:re.lastIndex,head:m.index});
  return found.map((x,i)=>({...x,body:md.slice(x.start,i+1<found.length?found[i+1].head:md.length).trim()}));
}
function bodyHtml(body){
  const lines=body.split(/\r?\n/), out=[]; let buf=[], list=[];
  const flush=()=>{if(buf.length){out.push('<div class="section">'+buf.join('')+'</div>');buf=[]} if(list.length){out.push('<div class="section"><ul>'+list.join('')+'</ul></div>');list=[]}};
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    if(/^###\s+/.test(line)){flush(); out.push('<div class="section"><h2>'+inline(line.replace(/^###\s+/,''))+'</h2></div>'); continue}
    const bullet=line.match(/^[-*]\s+(.+)/); if(bullet){list.push('<li>'+inline(bullet[1])+'</li>'); continue}
    const lead=line.match(/^\*\*(.+?):\s*\*\*\s*(.*)$/);
    if(lead){flush(); const cls=/alerta|contra|grave|urg|risco|máximo|maximo/i.test(lead[1])?'callout warn':'callout'; out.push('<div class="'+cls+'"><strong>'+esc(lead[1])+':</strong> '+inline(lead[2])+'</div>'); continue}
    buf.push('<p>'+inline(line)+'</p>');
  }
  flush(); return out.join('');
}
let topics=[], filtered=[];
function renderList(){
  const list=document.getElementById('list'); list.innerHTML='';
  filtered.forEach(t=>{const b=document.createElement('button'); b.className='topic-btn'; b.dataset.n=t.n; b.innerHTML='<small>'+t.n+'.</small> '+esc(t.title); b.onclick=()=>showTopic(t.n); list.appendChild(b)});
  document.getElementById('count').textContent=filtered.length+' de '+topics.length+' temas';
}
function showTopic(n){
  const t=topics.find(x=>x.n===n); if(!t)return;
  document.querySelectorAll('.topic-btn').forEach(b=>b.classList.toggle('active',Number(b.dataset.n)===n));
  document.getElementById('detail').innerHTML='<h2 class="topic-title"><span class="topic-number">'+t.n+'</span>'+esc(t.title)+'</h2>'+bodyHtml(t.body)+'<div class="meta">Fonte-base: PedWB — Compêndio pediátrico consolidado. Conteúdo documental organizado para consulta profissional; revisar indicação, população, apresentação e fonte primária aplicável antes de uso clínico.</div>';
  history.replaceState(null,'','#tema-'+n);
  if(innerWidth<841) document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'});
}
fetch('./PedWB_Consolidado.md',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(md=>{
  topics=parseTopics(md); filtered=[...topics]; renderList();
  const n=Number(location.hash.replace('#tema-','')); if(n&&topics.some(t=>t.n===n))showTopic(n); else if(topics.length)showTopic(topics[0].n);
}).catch(e=>{document.getElementById('detail').innerHTML='<div class="empty">Falha ao carregar o compêndio: '+esc(e.message)+'</div>';document.getElementById('count').textContent='Falha de carregamento'});
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(); filtered=!q?[...topics]:topics.filter(t=>(t.title+' '+t.body).toLowerCase().includes(q));renderList()});
</script>
</body></html>
