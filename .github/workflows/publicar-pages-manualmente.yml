name: Publicar site manualmente

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PUBLICAR para iniciar a publicação da branch principal'
        required: true
        type: choice
        options:
          - PUBLICAR

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar publicação
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          CONFIRMACAO="$(python3 -c 'import os; print(os.environ.get("CONFIRMACAO", "").strip())')"
          if [ "$CONFIRMACAO" != "PUBLICAR" ]; then
            echo "Digite PUBLICAR no campo de confirmação para continuar."
            exit 1
          fi

      - name: Baixar branch principal
        uses: actions/checkout@v4
        with:
          ref: principal

      - name: Testar site
        run: node --test tests/*.test.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Configurar origem do GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow

      - name: Build site
        run: |
          rm -rf dist
          mkdir -p dist
          cp .nojekyll index.html app.js styles.css dist/
          cp -R pedwb dist/

      - name: Clean previous Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')
          while IFS= read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done <<< "$artifact_ids"

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
