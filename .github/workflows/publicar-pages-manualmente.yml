name: Publicar site manualmente

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PUBLICAR para iniciar a publicação da branch main'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar publicação
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ "$CONFIRMACAO" != "PUBLICAR" ]; then
            echo "Digite PUBLICAR no campo de confirmação para continuar."
            exit 1
          fi

      - name: Baixar branch main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
